name: benchmark-weekly

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '**.md'
  schedule:
    - cron: '45 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "c-site-deploy"
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      compilers: ${{ steps.set-matrix.outputs.compilers }}
      platforms: ${{ steps.set-matrix.outputs.platforms }}
      run-date: ${{ steps.set-matrix.outputs.run-date }}
    steps:
      - id: set-matrix
        run: |
          echo 'compilers=["gcc", "clang"]' >> $GITHUB_OUTPUT
          echo 'platforms=["ubuntu-24.04", "ubuntu-24.04-arm", "ubuntu-22.04", "macos-15", "macos-26-intel", "macos-26"]' >> $GITHUB_OUTPUT
          echo "run-date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

  benchmark-windows:
    runs-on: windows-2022
    needs: setup
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git make gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-libxslt
            mingw-w64-ucrt-x86_64-libyaml
            mingw-w64-ucrt-x86_64-jansson
            mingw-w64-ucrt-x86_64-json-c
            mingw-w64-ucrt-x86_64-nlohmann-json

      - name: Build tris cores from source
        shell: msys2 {0}
        run: |
          mkdir -p /tmp/tris-libs
          # utf8proc has no UCRT64 package and leptris hard-requires it at
          # configure time — build + install it BEFORE the tris cores
          git clone -q --depth 1 https://github.com/JuliaStrings/utf8proc.git /tmp/utf8proc
          cmake -S /tmp/utf8proc -B /tmp/utf8proc/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DUTF8PROC_ENABLE_TESTING=OFF -DCMAKE_INSTALL_PREFIX=/tmp/utf8prefix > /dev/null
          cmake --build /tmp/utf8proc/build -j"$(nproc)" 2>&1 | tail -1
          cmake --install /tmp/utf8proc/build > /dev/null
          for repo in leptris yeptris teptris; do
            git clone -q --depth 1 https://github.com/leptris/$repo.git /tmp/$repo
            up=$(echo "$repo" | tr 'a-z' 'A-Z')
            cmake -S /tmp/$repo -B /tmp/$repo/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_C_STANDARD=11 -D${up}_ENABLE_LTO=OFF -D${up}_BUILD_CLI=OFF -DCMAKE_PREFIX_PATH="/tmp/utf8prefix;/ucrt64" > /dev/null
            cmake --build /tmp/$repo/build -j"$(nproc)" 2>&1 | tail -40
            find /tmp/$repo/build -name '*.a' | grep -v CMake | while read -r lib; do
              cp "$lib" /tmp/tris-libs/ 2>/dev/null || true
            done
          done
          ls /tmp/tris-libs/

      - name: Fetch tomlc17
        shell: msys2 {0}
        run: |
          git clone -q --depth 1 https://github.com/cktan/tomlc17.git /tmp/tomlc17 || true
          ls /tmp/tomlc17/src/tomlc17.h 2>/dev/null || echo "tomlc17 unavailable"

      - name: Build harness
        shell: msys2 {0}
        env:
          CC: gcc
          CXX: g++
        run: |
          TRIS_ARGS="-DLEPTRIS_LIB=/tmp/tris-libs/libleptris.a -DLEPTRIS_INC=/tmp/leptris/src/include \
                     -DYEPTRIS_LIB=/tmp/tris-libs/libyeptris.a -DYEPTRIS_INC=/tmp/yeptris/src/include \
                     -DTEPTRIS_LIB=/tmp/tris-libs/libteptris.a -DTEPTRIS_INC=/tmp/teptris/src/include -DCMAKE_C_FLAGS=-I/tmp/yeptris/build/generated"
          [ -f /tmp/tomlc17/src/tomlc17.h ] && TRIS_ARGS="$TRIS_ARGS -DTOMLC17_DIR=/tmp/tomlc17"
          # windows: apt/brew do not exist here — utf8proc is built from source,
          # and the msys cmake does not search /ucrt64 for the pacman libs
          TRIS_ARGS="$TRIS_ARGS -DUTF8PROC_LIB=/tmp/utf8prefix/lib/libutf8proc.a -DCMAKE_PREFIX_PATH=/ucrt64"
          # shellcheck disable=SC2086
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release $TRIS_ARGS
          cmake --build build

      - name: Load canonical fixtures
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/serialbench/fixtures.git fixtures
          (cd fixtures && sha256sum -c SHA256SUMS)

      - name: Correctness gate
        shell: msys2 {0}
        run: |
          set -o pipefail
          ./build/serialbench-c fixtures /dev/null check | tee /tmp/check.log
          grep -q "CHECK FAILED" /tmp/check.log && { echo "::error::correctness gate failed"; exit 1; }
          for spec in "xml leptris libxml2 pugixml" "html leptris libxml2"; do
            set -- $spec; fmt=$1; shift
            ads=$(printf "%s|" "$@"); ads=${ads%|}
            for sz in small medium large; do
              distinct=$(grep "^CHECK $fmt " /tmp/check.log | grep -wE "$ads" | grep " $sz " | grep -oE "count=[0-9]+" | sort -u | wc -l | tr -d " ")
              echo "$fmt/$sz element counts: $distinct distinct (expect 1)"
              [ "$distinct" = "1" ] || { echo "::error::$fmt/$sz element counts disagree across adapters"; exit 1; }
            done
          done

      - name: Benchmark each format
        continue-on-error: true
        shell: msys2 {0}
        env:
          SERIALBENCH_PLATFORM: windows-2022
          SERIALBENCH_C_VERSION: gcc
          DATA_RUN_DATE: ${{ needs.setup.outputs.run-date }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          for FMT in xml html json yaml toml cbor; do
            if [ "${{ github.run_attempt }}" -gt 1 ] && .github/scripts/format-status.sh "$FMT" gcc windows-2022; then
              echo "$FMT already in data repo — skipping"
              continue
            fi
            mkdir -p "results/$FMT"
            C_VERSION="gcc" ./build/serialbench-c fixtures "results/$FMT/results.yaml" "$FMT"
            .github/scripts/push-to-data.sh "$FMT" gcc windows-2022
          done

      - name: Verify leg completeness
        if: ${{ !cancelled() }}
        shell: msys2 {0}
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_RUN_DATE: ${{ needs.setup.outputs.run-date }}
        run: |
          MISSING=""
          for FMT in xml html json yaml toml cbor; do
            if .github/scripts/format-status.sh "$FMT" "gcc" "windows-2022"; then
              echo "$FMT: in data repo"
            else
              echo "$FMT: MISSING from data repo"
              MISSING="$MISSING $FMT"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::formats never pushed:${MISSING} — failing the leg so autoheal fills the gap"
            exit 1
          fi

  benchmark:
    runs-on: ${{ matrix.platform }}
    needs: setup
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.setup.outputs.platforms) }}
        compiler: ${{ fromJson(needs.setup.outputs.compilers) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system field
        run: |
          if command -v apt-get >/dev/null; then
            sudo apt-get update && sudo apt-get install -y libxml2-dev libxslt1-dev libyaml-dev libjansson-dev libjson-c-dev nlohmann-json3-dev libutf8proc-dev
          elif command -v brew >/dev/null; then
            brew install libxml2 libxslt libyaml jansson json-c nlohmann-json utf8proc
          fi
        shell: bash

      - name: Build tris cores from source
        run: |
          mkdir -p /tmp/tris-libs
          # Each tris lib has its own *_ENABLE_LTO (default ON for Release) which
          # force-sets CMAKE_INTERPROCEDURAL_OPTIMIZATION and overrides the cache
          # var; LTO archives also fail to link under clang's ld (plugin needed).
          # (LEPTRIS_AMALGAMATED is the no-LTO alternative but is currently
          # broken upstream: duplicate static symbols across TUs, e.g.
          # parse_pattern, xslt_register_ufn_handlers, set_error.)
          for repo in leptris yeptris teptris; do
            git clone -q --depth 1 https://github.com/leptris/$repo.git /tmp/$repo
            up=$(echo "$repo" | tr 'a-z' 'A-Z')
            cmake -S /tmp/$repo -B /tmp/$repo/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_C_STANDARD=11 -D${up}_ENABLE_LTO=OFF > /dev/null
            cmake --build /tmp/$repo/build -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)" 2>&1 | tail -1
            find /tmp/$repo/build -name '*.so*' -o -name '*.dylib*' -o -name '*.a' | grep -v CMake | while read -r lib; do
              cp "$lib" /tmp/tris-libs/ 2>/dev/null || true
            done
          done
          ls /tmp/tris-libs/
        shell: bash

      - name: Fetch tomlc17
        run: |
          git clone -q --depth 1 https://github.com/cktan/tomlc17.git /tmp/tomlc17 || true
          ls /tmp/tomlc17/src/tomlc17.h 2>/dev/null || echo "tomlc17 unavailable"
        shell: bash

      - name: Build harness
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: |
          TRIS_ARGS="-DLEPTRIS_LIB=/tmp/tris-libs/libleptris.a -DLEPTRIS_INC=/tmp/leptris/src/include \
                     -DYEPTRIS_LIB=/tmp/tris-libs/libyeptris.a -DYEPTRIS_INC=/tmp/yeptris/src/include \
                     -DTEPTRIS_LIB=/tmp/tris-libs/libteptris.a -DTEPTRIS_INC=/tmp/teptris/src/include -DCMAKE_C_FLAGS=-I/tmp/yeptris/build/generated"
          [ -f /tmp/tomlc17/src/tomlc17.h ] && TRIS_ARGS="$TRIS_ARGS -DTOMLC17_DIR=/tmp/tomlc17"
          PREFIX_ARGS=""
          if command -v brew >/dev/null; then
            PREFIX_ARGS="-DCMAKE_PREFIX_PATH=$(brew --prefix libxml2);$(brew --prefix libxslt);$(brew --prefix jansson);$(brew --prefix json-c);$(brew --prefix nlohmann-json);$(brew --prefix libyaml)"
          fi
          # shellcheck disable=SC2086
          cmake -B build -DCMAKE_BUILD_TYPE=Release $TRIS_ARGS $PREFIX_ARGS
          cmake --build build
        shell: bash

      - name: Load canonical fixtures
        run: |
          git clone --depth 1 https://github.com/serialbench/fixtures.git fixtures
          (cd fixtures && sha256sum -c SHA256SUMS) || (cd fixtures && shasum -a 256 -c SHA256SUMS)
        shell: bash

      - name: Correctness gate
        run: |
          set -o pipefail
          ./build/serialbench-c fixtures /dev/null check | tee /tmp/check.log
          grep -q "CHECK FAILED" /tmp/check.log && { echo "::error::correctness gate failed"; exit 1; }
          # element counts must agree across a format's adapters
          for spec in "xml leptris libxml2 pugixml" "html leptris libxml2"; do
            set -- $spec; fmt=$1; shift
            ads=$(printf "%s|" "$@"); ads=${ads%|}
            for sz in small medium large; do
              distinct=$(grep "^CHECK $fmt " /tmp/check.log | grep -wE "$ads" | grep " $sz " | grep -oE "count=[0-9]+" | sort -u | wc -l | tr -d " ")
              echo "$fmt/$sz element counts: $distinct distinct (expect 1)"
              [ "$distinct" = "1" ] || { echo "::error::$fmt/$sz element counts disagree across adapters"; exit 1; }
            done
          done
        shell: bash

      - name: Benchmark each format
        continue-on-error: true
        shell: bash
        env:
          SERIALBENCH_PLATFORM: ${{ matrix.platform }}
          SERIALBENCH_C_VERSION: ${{ matrix.compiler }}
          DATA_RUN_DATE: ${{ needs.setup.outputs.run-date }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          for FMT in xml html json yaml toml cbor; do
            if [ "${{ github.run_attempt }}" -gt 1 ] && .github/scripts/format-status.sh "$FMT" ${{ matrix.compiler }} ${{ matrix.platform }}; then
              echo "$FMT already in data repo — skipping"
              continue
            fi
            mkdir -p "results/$FMT"
            C_VERSION="${{ matrix.compiler }}" ./build/serialbench-c fixtures "results/$FMT/results.yaml" "$FMT"
            .github/scripts/push-to-data.sh "$FMT" ${{ matrix.compiler }} ${{ matrix.platform }}
          done

      - name: Verify leg completeness
        if: ${{ !cancelled() }}
        shell: bash
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_RUN_DATE: ${{ needs.setup.outputs.run-date }}
        run: |
          MISSING=""
          for FMT in xml html json yaml toml cbor; do
            if .github/scripts/format-status.sh "$FMT" "${{ matrix.compiler }}" "${{ matrix.platform }}"; then
              echo "$FMT: in data repo"
            else
              echo "$FMT: MISSING from data repo"
              MISSING="$MISSING $FMT"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::formats never pushed:${MISSING} — failing the leg so autoheal fills the gap"
            exit 1
          fi
